<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Smart Attendance System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <!-- TITLE -->
                    <h3 class="text-center text-primary mb-4">

                        Smart Attendance System

                    </h3>

                    <!-- FORM -->
                    <form th:action="@{/save-attendance}"
                          method="post"
                          th:object="${attendance}">

                        <!-- STUDENT DROPDOWN -->
                        <div class="mb-3">

                            <label class="form-label">

                                Select Student

                            </label>

                            <select th:field="*{studentId}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Student
                                </option>

                                <option th:each="s : ${students}"
                                        th:value="${s.id}"
                                        th:text="${s.studentNo + ' - ' + s.name}">
                                </option>

                            </select>

                        </div>

                        <!-- STATUS -->
                        <div class="mb-4">

                            <label class="form-label">

                                Attendance Status

                            </label>

                            <select th:field="*{status}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Status
                                </option>

                                <option value="Present">
                                    Present
                                </option>

                                <option value="Absent">
                                    Absent
                                </option>

                            </select>

                        </div>

                        <!-- BUTTONS -->
                        <div class="d-flex justify-content-between">

                            <a href="/attendance"
                               class="btn btn-secondary">

                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                Save Attendance

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
