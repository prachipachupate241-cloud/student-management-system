<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Student Attendance</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->

    <h1 class="text-center text-primary mb-4">

        Student Attendance Report

    </h1>

    <!-- STUDENT INFO -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h3 th:text="${student.name}"></h3>

            <p>

                <b>Course:</b>

                <span th:text="${student.course}"></span>

            </p>

            <p>

                <b>Year:</b>

                <span th:text="${student.year}"></span>

            </p>

        </div>

    </div>

    <!-- SUMMARY -->

    <div class="row mb-4">

        <!-- PRESENT -->

        <div class="col-md-4">

            <div class="card bg-success text-white shadow">

                <div class="card-body text-center">

                    <h3>Present</h3>

                    <h1 th:text="${present}"></h1>

                </div>

            </div>

        </div>

        <!-- ABSENT -->

        <div class="col-md-4">

            <div class="card bg-danger text-white shadow">

                <div class="card-body text-center">

                    <h3>Absent</h3>

                    <h1 th:text="${absent}"></h1>

                </div>

            </div>

        </div>

        <!-- PERCENTAGE -->

        <div class="col-md-4">

            <div class="card bg-primary text-white shadow">

                <div class="card-body text-center">

                    <h3>Attendance %</h3>

                    <h1>

                        <span th:text=
                                      "${#numbers.formatDecimal(percentage,1,2)}">

                        </span> %

                    </h1>

                </div>

            </div>

        </div>

    </div>

    <!-- HISTORY -->

    <div class="card shadow">

        <div class="card-body">

            <h3 class="mb-3">

                Attendance History

            </h3>

            <table class="table table-bordered text-center">

                <thead class="table-dark">

                <tr>

                    <th>Date</th>

                    <th>Status</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="a : ${attendanceList}">

                    <td th:text="${a.date}"></td>

                    <td>

                        <span class="badge bg-success"

                              th:if="${a.status == 'Present'}">

                            Present

                        </span>

                        <span class="badge bg-danger"

                              th:if="${a.status == 'Absent'}">

                            Absent

                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- BACK BUTTON -->

    <div class="mt-4 text-end">

        <a href="/students"
           class="btn btn-dark">

            Back

        </a>

    </div>

</div>

</body>
</html>
