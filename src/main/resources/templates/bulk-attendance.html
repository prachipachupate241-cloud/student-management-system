<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Bulk Attendance System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->
    <h2 class="text-center text-primary mb-4">

        Smart Attendance System

    </h2>

    <!-- FORM -->
    <form th:action="@{/save-bulk-attendance}"
          method="post">

        <!-- CSRF TOKEN -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <div class="card shadow">

            <div class="card-body">

                <table class="table table-bordered text-center align-middle">

                    <!-- HEADER -->
                    <thead class="table-dark">

                    <tr>

                        <th>Student No</th>
                        <th>Student Name</th>
                        <th>Present</th>
                        <th>Absent</th>

                    </tr>

                    </thead>

                    <!-- BODY -->
                    <tbody>

                    <tr th:each="s : ${students}">

                        <!-- STUDENT ID -->
                        <input type="hidden"
                               name="studentId"
                               th:value="${s.id}">

                        <td th:text="${s.studentNo}"></td>

                        <td th:text="${s.name}"></td>

                        <!-- PRESENT -->
                        <td>

                            <input type="radio"
                                   th:name="'status_' + ${s.id}"
                                   value="Present"
                                   checked>

                        </td>

                        <!-- ABSENT -->
                        <td>

                            <input type="radio"
                                   th:name="'status_' + ${s.id}"
                                   value="Absent">

                        </td>

                    </tr>

                    </tbody>

                </table>

                <!-- BUTTONS -->
                <div class="text-end">

                    <a href="/students"
                       class="btn btn-secondary">

                        Back

                    </a>

                    <button type="submit"
                            class="btn btn-success">

                        Save Attendance

                    </button>

                </div>

            </div>

        </div>

    </form>

</div>

</body>
</html>
