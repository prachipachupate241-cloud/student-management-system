<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Result System</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->

    <div class="d-flex justify-content-between mb-4">

        <h2 class="text-primary fw-bold">

            Result Management System

        </h2>

        <a href="/students"
           class="btn btn-dark">

            Back

        </a>

    </div>

    <!-- USER ONLY VIEW BUTTON -->

    <div class="mb-4 text-end"
         th:if="${#authorization.expression('hasRole(''USER'')')}">

        <a href="/results"
           class="btn btn-primary">

            View Results

        </a>

    </div>

    <!-- TABLE -->

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-bordered table-hover text-center">

                <thead class="table-dark">

                <tr>

                    <th>Student No</th>

                    <th>Name</th>

                    <th>Course</th>

                    <th>Year</th>

                    <!-- ADMIN ONLY COLUMN -->
                    <th th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        Add Result
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="s : ${students}">

                    <td th:text="${s.studentNo}"></td>

                    <td th:text="${s.name}"></td>

                    <td th:text="${s.course}"></td>

                    <td th:text="${s.year}"></td>

                    <!-- ADMIN ONLY BUTTON -->
                    <td th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

                        <a th:href=
                                   "@{/add-result/{id}(id=${s.id})}"

                           class="btn btn-success btn-sm">

                            Add Result

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
