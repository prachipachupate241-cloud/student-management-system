<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Attendance History</title>

    <!-- Bootstrap -->

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->

    <h1 class="text-center text-primary mb-5">

        Attendance History

    </h1>

    <!-- BACK BUTTON -->

    <div class="d-flex justify-content-end mb-3">

        <a href="/students"
           class="btn btn-dark">

            Back

        </a>

    </div>

    <!-- TABLE -->

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-bordered table-hover text-center align-middle">

                <!-- HEADER -->

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Student Name</th>

                    <th>Date</th>

                    <th>Status</th>

                    <th>Delete</th>

                </tr>

                </thead>

                <!-- BODY -->

                <tbody>

                <tr th:each="a : ${attendanceList}">

                    <!-- ID -->

                    <td th:text="${a.id}"></td>

                    <!-- NAME -->

                    <td th:text="${a.studentName}"></td>

                    <!-- DATE -->

                    <td th:text="${a.date}"></td>

                    <!-- STATUS -->

                    <td>

                        <!-- PRESENT -->

                        <span class="badge bg-success"

                              th:if="${a.status == 'Present'}">

                            Present

                        </span>

                        <!-- ABSENT -->

                        <span class="badge bg-danger"

                              th:if="${a.status == 'Absent'}">

                            Absent

                        </span>

                    </td>

                    <!-- DELETE -->

                    <td>

                        <a th:href=
                                   "@{/deleteAttendance/{id}(id=${a.id})}"

                           class="btn btn-danger btn-sm">

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
