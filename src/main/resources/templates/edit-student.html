<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            Student Management
        </a>

        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/students"
               class="btn btn-outline-light me-2">
                Students
            </a>

            <a href="/add"
               class="btn btn-outline-light me-2">
                Add Student
            </a>

            <a href="/logout"
               class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-primary mb-4">
            Edit Student
        </h2>

        <form th:action="@{/update}"
              method="post">

            <input type="hidden"
                   name="id"
                   th:value="${student.id}">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input type="text"
                       name="name"
                       th:value="${student.name}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Class
                </label>

                <input type="text"
                       name="studentClass"
                       th:value="${student.studentClass}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       name="email"
                       th:value="${student.email}"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary">
                Update Student
            </button>

        </form>

    </div>

</div>

</body>
</html>
