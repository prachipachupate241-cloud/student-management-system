<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <title>Add Result</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- ADMIN ONLY PAGE -->

<div class="container mt-5"
     sec:authorize="hasRole('ADMIN')">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary mb-4">

            Add Student Result

        </h2>

        <!-- FORM -->

        <form action="/saveResult"
              method="post"
              th:object="${result}">

            <!-- STUDENT ID -->

            <input type="hidden"
                   th:field="*{studentId}">

            <!-- STUDENT NAME -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    Student Name

                </label>

                <input type="text"
                       th:field="*{studentName}"
                       class="form-control"
                       readonly>

            </div>

            <!-- JAVA -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    Java Marks

                </label>

                <input type="number"
                       th:field="*{javaMarks}"
                       class="form-control"
                       required>

            </div>

            <!-- PYTHON -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    Python Marks

                </label>

                <input type="number"
                       th:field="*{pythonMarks}"
                       class="form-control"
                       required>

            </div>

            <!-- DBMS -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    DBMS Marks

                </label>

                <input type="number"
                       th:field="*{dbmsMarks}"
                       class="form-control"
                       required>

            </div>

            <!-- CLOUD -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    Cloud Computing Marks

                </label>

                <input type="number"
                       th:field="*{cloudMarks}"
                       class="form-control"
                       required>

            </div>

            <!-- BUTTON -->

            <button type="submit"
                    class="btn btn-success w-100 fw-bold">

                Save Result

            </button>

        </form>

    </div>

</div>

</body>
</html>
