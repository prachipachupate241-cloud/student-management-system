<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <title>Student Results</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->

    <h1 class="text-center text-primary mb-4">

        Student Result Management

    </h1>

    <!-- TABLE -->

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-bordered table-hover text-center">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Student Name</th>

                    <th>Java</th>

                    <th>Python</th>

                    <th>DBMS</th>

                    <th>Cloud</th>

                    <th>Total</th>

                    <th>Percentage</th>

                    <th>Grade</th>

                    <th>Result</th>

                    <!-- ADMIN ONLY -->

                    <th sec:authorize="hasRole('ADMIN')">

                        Action

                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="r : ${results}">

                    <td th:text="${r.id}"></td>

                    <td th:text="${r.studentName}"></td>

                    <td th:text="${r.javaMarks}"></td>

                    <td th:text="${r.pythonMarks}"></td>

                    <td th:text="${r.dbmsMarks}"></td>

                    <td th:text="${r.cloudMarks}"></td>

                    <td th:text="${r.total}"></td>

                    <td>

                        <span th:text=
                                      "${#numbers.formatDecimal(r.percentage,1,2)}">

                        </span> %

                    </td>

                    <td>

                        <span class="badge bg-primary"
                              th:text="${r.grade}">

                        </span>

                    </td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${r.result == 'Pass'}">

                            Pass

                        </span>

                        <span class="badge bg-danger"
                              th:if="${r.result == 'Fail'}">

                            Fail

                        </span>

                    </td>

                    <!-- ADMIN ONLY DELETE -->

                    <td sec:authorize="hasRole('ADMIN')">

                        <a th:href=
                                   "@{/deleteResult/{id}(id=${r.id})}"

                           class="btn btn-danger btn-sm">

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- BACK -->

    <div class="mt-4 text-end">

        <a href="/students"
           class="btn btn-dark">

            Back

        </a>

    </div>

</div>

</body>
</html>
