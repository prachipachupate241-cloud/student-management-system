<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <title>Student Management System</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        body{
            background:#f4f7fc;
        }

        .dashboard-card{
            border-radius:15px;
            color:white;
            padding:25px;
            text-align:center;
            font-weight:bold;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        .table{
            background:white;
            border-radius:10px;
            overflow:hidden;
        }

        .table thead{
            background:#0d1b3e;
            color:white;
        }

        .badge-course{
            background:#11cdef;
        }

        .badge-year{
            background:#f4b400;
            color:black;
        }

    </style>

</head>

<body>

<div class="container-fluid mt-4">

    <!-- TITLE -->

    <h1 class="text-center text-primary fw-bold mb-5">

        Student Management System

    </h1>

    <!-- DASHBOARD -->

    <div class="row mb-4">

        <!-- TOTAL -->

        <div class="col-md-3">

            <div class="dashboard-card bg-primary">

                <h3>Total Students</h3>

                <h1 th:text="${totalStudents}"></h1>

            </div>

        </div>

        <!-- IT -->

        <div class="col-md-3">

            <div class="dashboard-card bg-success">

                <h3>IT Students</h3>

                <h1 th:text="${itCount}"></h1>

            </div>

        </div>

        <!-- BCA -->

        <div class="col-md-3">

            <div class="dashboard-card bg-warning text-dark">

                <h3>BCA Students</h3>

                <h1 th:text="${bcaCount}"></h1>

            </div>

        </div>

        <!-- BCOM -->

        <div class="col-md-3">

            <div class="dashboard-card bg-danger">

                <h3>BCOM Students</h3>

                <h1 th:text="${bcomCount}"></h1>

            </div>

        </div>

    </div>

    <!-- SEARCH -->

    <form th:action="@{/students}" method="get">

        <div class="row mb-4">

            <div class="col-md-4">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search by Name / Email / Student No">

            </div>

            <div class="col-md-2">

                <button class="btn btn-primary w-100">

                    Search

                </button>

            </div>

            <div class="col-md-2">

                <a href="/students"
                   class="btn btn-secondary w-100">

                    Reset

                </a>

            </div>

        </div>

    </form>

    <!-- BUTTONS -->

    <div class="mb-4 text-end">

        <!-- ADMIN ONLY -->

        <span sec:authorize="hasRole('ADMIN')">

            <a href="/add"
               class="btn btn-success">

                + Add Student

            </a>

            <a href="/attendance"
               class="btn btn-dark">

                Mark Attendance

            </a>

            <a href="/attendance-history"
               class="btn btn-primary">

                Attendance History

            </a>

            <a href="/monthly-attendance"
               class="btn btn-warning">

                Monthly Report

            </a>

            <a href="/results-system"
               class="btn btn-primary">

                Result System

            </a>

            <a href="/results"
               class="btn btn-success">

                View Results

            </a>

        </span>

        <!-- USER ONLY -->

        <span sec:authorize="hasRole('USER')">

            <a href="/results"
               class="btn btn-success">

                View Results

            </a>

        </span>

    </div>

    <!-- TABLE -->

    <div class="table-responsive">

        <table class="table table-bordered align-middle">

            <thead>

            <tr>

                <th>Sr No</th>
                <th>Student No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Course</th>
                <th>Year</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="s, i : ${students}">

                <!-- SR NO -->

                <td th:text="${i.count}"></td>

                <!-- STUDENT NO -->

                <td th:text="${s.studentNo}"></td>

                <!-- NAME -->

                <td>

                    <a th:href="@{/student-attendance/{id}(id=${s.id})}"

                       th:text="${s.name}"

                       class="text-decoration-none fw-bold">

                    </a>

                </td>

                <!-- EMAIL -->

                <td th:text="${s.email}"></td>

                <!-- PHONE -->

                <td th:text="${s.phone}"></td>

                <!-- ADDRESS -->

                <td th:text="${s.address}"></td>

                <!-- COURSE -->

                <td>

                    <span class="badge badge-course"
                          th:text="${s.course}"></span>

                </td>

                <!-- YEAR -->

                <td>

                    <span class="badge badge-year"
                          th:text="${s.year}"></span>

                </td>

                <!-- ACTION -->

                <td>

                    <!-- ADMIN -->

                    <div sec:authorize="hasRole('ADMIN')">

                        <a th:href="@{/edit/{id}(id=${s.id})}"
                           class="btn btn-warning btn-sm">

                            Edit

                        </a>

                        <a th:href="@{/delete/{id}(id=${s.id})}"
                           class="btn btn-danger btn-sm">

                            Delete

                        </a>

                    </div>

                    <!-- USER -->

                    <div sec:authorize="hasRole('USER')">

                        <span class="text-success fw-bold">

                            View Only

                        </span>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
