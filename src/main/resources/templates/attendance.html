<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Attendance System</title>

    <!-- Bootstrap -->

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->

    <h1 class="text-center text-primary mb-4">

        Attendance System

    </h1>

    <!-- FILTER FORM -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <form action="/attendance"
                  method="get">

                <div class="row">

                    <!-- COURSE -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Select Course

                        </label>

                        <select name="course"
                                class="form-select">

                            <option value="">
                                Select Course
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="BCOM">
                                BCOM
                            </option>

                        </select>

                    </div>

                    <!-- YEAR -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Select Year

                        </label>

                        <select name="year"
                                class="form-select">

                            <option value="">
                                Select Year
                            </option>

                            <option value="FY">
                                FY
                            </option>

                            <option value="SY">
                                SY
                            </option>

                            <option value="TY">
                                TY
                            </option>

                        </select>

                    </div>

                    <!-- BUTTON -->

                    <div class="col-md-4 d-flex align-items-end">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Filter Students

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- SUCCESS MESSAGE -->

    <div th:if="${param.success}"
         class="alert alert-success">

        Attendance Saved Successfully

    </div>

    <!-- ERROR MESSAGE -->

    <div th:if="${param.error}"
         class="alert alert-danger">

        Attendance Already Marked For Today

    </div>

    <!-- BACK BUTTON -->

    <div class="mb-3 text-end">

        <a href="/students"
           class="btn btn-dark">

            Back

        </a>

    </div>

    <!-- ATTENDANCE TABLE -->

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-bordered table-hover text-center align-middle">

                <!-- HEADER -->

                <thead class="table-dark">

                <tr>

                    <th>Student No</th>

                    <th>Name</th>

                    <th>Course</th>

                    <th>Year</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>

                <!-- BODY -->

                <tbody>

                <tr th:each="s : ${students}">

                    <!-- STUDENT NO -->

                    <td th:text="${s.studentNo}"></td>

                    <!-- NAME -->

                    <td th:text="${s.name}"></td>

                    <!-- COURSE -->

                    <td>

                        <span class="badge bg-info"
                              th:text="${s.course}">

                        </span>

                    </td>

                    <!-- YEAR -->

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:text="${s.year}">

                        </span>

                    </td>

                    <!-- ATTENDANCE FORM -->

                    <td colspan="2">

                        <form action="/saveAttendance"
                              method="post">

                            <div class="row">

                                <!-- STUDENT ID -->

                                <input type="hidden"
                                       name="studentId"
                                       th:value="${s.id}">

                                <!-- STUDENT NAME -->

                                <input type="hidden"
                                       name="studentName"
                                       th:value="${s.name}">

                                <!-- AUTO DATE -->

                                <input type="hidden"
                                       name="date"
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">

                                <!-- STATUS -->

                                <div class="col-md-6">

                                    <select name="status"
                                            class="form-select">

                                        <option value="Present">

                                            Present

                                        </option>

                                        <option value="Absent">

                                            Absent

                                        </option>

                                    </select>

                                </div>

                                <!-- BUTTON -->

                                <div class="col-md-6">

                                    <button type="submit"
                                            class="btn btn-success w-100">

                                        Save

                                    </button>

                                </div>

                            </div>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
