
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card shadow p-4">

                <h2 class="text-center text-primary mb-4">
                    Login
                </h2>

                <!-- LOGIN FORM -->

                <form th:action="@{/login}" method="post">

                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Username
                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Enter username"
                               required>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter password"
                               required>

                    </div>

                    <!-- BUTTON -->

                    <button type="submit"
                            class="btn btn-primary w-100 fw-bold">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
