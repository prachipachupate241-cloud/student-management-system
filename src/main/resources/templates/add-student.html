<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Student</title>

    <!-- Bootstrap -->

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <!-- TITLE -->

                    <h2 class="text-center text-primary mb-4">

                        Add Student

                    </h2>

                    <!-- FORM -->

                    <form th:action="@{/save}"
                          th:object="${student}"
                          method="post">

                        <div class="row">

                            <!-- STUDENT NO -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Student No

                                </label>

                                <input type="text"
                                       th:field="*{studentNo}"
                                       class="form-control"
                                       placeholder="Enter Student No"
                                       required>

                            </div>

                            <!-- NAME -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Name

                                </label>

                                <input type="text"
                                       th:field="*{name}"
                                       class="form-control"
                                       placeholder="Enter Name"
                                       required>

                            </div>

                            <!-- EMAIL -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Email

                                </label>

                                <input type="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="Enter Email"
                                       required>

                            </div>

                            <!-- PHONE -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Phone

                                </label>

                                <input type="text"
                                       th:field="*{phone}"
                                       class="form-control"
                                       placeholder="Enter Phone Number"
                                       pattern="[0-9]{10}"
                                       maxlength="10"
                                       required>

                                <small class="text-danger">

                                    Phone number must be 10 digits

                                </small>

                            </div>

                            <!-- ADDRESS -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Address

                                </label>

                                <textarea th:field="*{address}"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Enter Address"
                                          required></textarea>

                            </div>

                            <!-- COURSE -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Course

                                </label>

                                <select th:field="*{course}"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Course
                                    </option>

                                    <option value="BCA">
                                        BCA
                                    </option>

                                    <option value="IT">
                                        IT
                                    </option>

                                    <option value="BCOM">
                                        BCOM
                                    </option>

                                </select>

                            </div>

                            <!-- YEAR -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Year

                                </label>

                                <select th:field="*{year}"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Year
                                    </option>

                                    <option value="FY">
                                        FY
                                    </option>

                                    <option value="SY">
                                        SY
                                    </option>

                                    <option value="TY">
                                        TY
                                    </option>

                                </select>

                            </div>

                        </div>

                        <!-- BUTTONS -->

                        <div class="text-center mt-4">

                            <!-- SAVE -->

                            <button type="submit"
                                    class="btn btn-success px-4">

                                Save Student

                            </button>

                            <!-- BACK -->

                            <a href="/students"
                               class="btn btn-dark px-4">

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
